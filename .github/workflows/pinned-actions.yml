name: Pinned actions

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: pinned-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Actions and images pinned immutably
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Require full commit SHAs and image digests
        run: bash scripts/verify-actions-pinned.sh
