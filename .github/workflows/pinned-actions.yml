name: Pinned actions

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: pinned-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Actions and images pinned immutably
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require full commit SHAs and image digests
        run: bash scripts/verify-actions-pinned.sh
